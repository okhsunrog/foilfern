[package]
name = "foilfern-import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Import of EAGLE and KiCad libraries and projects into LibrePCB"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clipper = { version = "0.1.0", path = "../clipper" }
html-escape = "0.2.15"
foilfern-core = { version = "0.1.0", path = "../foilfern-core" }
foilfern-i18n = { version = "0.1.0", path = "../foilfern-i18n" }
log = "0.4.34"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
static_assertions = "1.1.0"
thiserror = "2.0.21"
sha2 = "0.11.1"
svgtypes = "0.16.2"
kurbo = "0.13.1"
libm = "0.2.16"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
