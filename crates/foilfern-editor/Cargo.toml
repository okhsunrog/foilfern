[package]
name = "foilfern-editor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bitflags = "2.13.2"
clipper = { version = "0.1.0", path = "../clipper" }
libm = "0.2.16"
foilfern-autoroute = { version = "0.1.0", path = "../foilfern-autoroute" }
foilfern-core = { version = "0.1.0", path = "../foilfern-core" }
foilfern-i18n = { version = "0.1.0", path = "../foilfern-i18n" }
log = "0.4.34"
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
serde = { version = "1.0.229", features = ["derive"] }
static_assertions = "1.1.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
which = "8.0.6"

[lints]
workspace = true

[dev-dependencies]
foilfern-scene = { path = "../foilfern-scene" }
serde_json = "1.0.151"
