[package]
name = "foilfern-app-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The compiled Slint UI of the LibrePCB application (ported from upstream)"

# Generated code only (~53 MB of Rust): a test build would compile it a
# second time for nothing.
[lib]
test = false
doctest = false

# The workspace lints, except that unsafe code is denied instead of
# forbidden: Slint's generated code needs a local `#[allow(unsafe_code)]`.
# The crate itself contains no unsafe code.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
slint = { git = "https://github.com/slint-ui/slint", rev = "aebe3dd580ce0594de272bc5797b7444a2aa18fd", version = "1.20.0" }

[build-dependencies]
foilfern-i18n = { version = "0.1.0", path = "../../foilfern-i18n" }
slint-build = { git = "https://github.com/slint-ui/slint", rev = "aebe3dd580ce0594de272bc5797b7444a2aa18fd", version = "1.20.0" }
