[package]
name = "foilfern-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "foilfern-mcp"
path = "src/main.rs"
# The binary has no unit tests (they live in the library): do not link an
# empty test harness of the whole dependency tree.
test = false

[features]
default = []
# Streamable HTTP transport (`--http <addr>`).
http = [
    "rmcp/transport-streamable-http-server",
    "dep:axum",
    "dep:tokio-util",
    "tokio/signal",
    "tokio/net",
]

[dependencies]
alphanumeric-sort = "1.5.8"
axum = { version = "0.8.9", optional = true }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
foilfern-core = { version = "0.1.0", path = "../foilfern-core" }
foilfern-editor = { version = "0.1.0", path = "../foilfern-editor" }
foilfern-graphics = { version = "0.1.0", path = "../foilfern-graphics" }
foilfern-import = { version = "0.1.0", path = "../foilfern-import" }
foilfern-network = { version = "0.1.0", path = "../foilfern-network" }
foilfern-scene = { version = "0.1.0", path = "../foilfern-scene" }
foilfern-step = { version = "0.1.0", path = "../foilfern-step" }
log = "0.4.34"
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
rmcp = { version = "3.4.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "io-std"] }
tokio-util = { version = "0.7.19", optional = true }

[lints]
workspace = true

[dev-dependencies]
rmcp = { version = "3.4.1", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process"] }
