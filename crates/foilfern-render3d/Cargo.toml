[dependencies]
bevy = { version = "0.20.1", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_core_pipeline", "bevy_pbr", "bevy_window", "multi_threaded", "png"] }
clipper = { version = "0.1.0", path = "../clipper" }
