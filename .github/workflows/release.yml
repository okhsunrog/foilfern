name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  linux:
    name: Linux x86_64 binaries
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      TOKIO_WORKER_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Prepare native dependencies and reference sources
        env:
          LIBREPCB_UPSTREAM_DIR: ${{ runner.temp }}/LibrePCB
          LIBREPCB_TOOLS_DIR: ${{ runner.temp }}/foilfern-tools
          LIBREPCB_BIN_DIR: ${{ runner.temp }}/bin
        run: |
          bash scripts/cloud-setup.sh
          sudo apt-get install -y patchelf file xdotool
          echo "LIBREPCB_UPSTREAM_DIR=$LIBREPCB_UPSTREAM_DIR" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-release
          cache-on-failure: true
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/check-release-version.sh "$RELEASE_TAG"
      - name: Build GUI, CLI and HTTP-enabled MCP server
        run: cargo build --locked --release -p foilfern-app -p foilfern-cli -p foilfern-mcp --features foilfern-mcp/http --bins
      - name: Package and smoke-test Linux downloads
        run: bash scripts/package-linux.sh "$RUNNER_TEMP/package" "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foilfern-linux-x86_64
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain packaging smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-smoke-evidence
          path: |
            ${{ runner.temp }}/package/smoke.png
            ${{ runner.temp }}/package/server-info.jsonl
            ${{ runner.temp }}/package/smoke-results.jsonl
            ${{ runner.temp }}/package/desktop.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish downloads
    needs: linux
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foilfern-linux-x86_64
          path: dist
      - name: Publish checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Foilfern $RELEASE_TAG" --generate-notes ./*
          gh release edit "$RELEASE_TAG" --draft=false
