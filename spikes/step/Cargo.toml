[package]
name = "step-spike"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
anyhow = "1.0.104"
foilfern-core = { version = "0.1.0", path = "../../crates/foilfern-core" }
foilfern-step = { version = "0.1.0", path = "../../crates/foilfern-step", features = ["diagnostics"] }
monstertruck-io = "0.4.1"
monstertruck-meshing = "0.4.1"
monstertruck-modeling = "0.4.1"
monstertruck-topology = "0.4.1"
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
